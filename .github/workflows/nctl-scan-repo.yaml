name: NCTL Scan Repo
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch: # Allow manual triggering
env:
  NIRMATA_TOKEN: ${{ secrets.NIRMATA_TOKEN }}
  NIRMATA_URL: ${{ secrets.NIRMATA_URL }}
  NIRMATA_USERID: ${{ secrets.NIRMATA_USERID }}
jobs:
  nctl-scan:
    name: NCTL Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Fetch full history for better scanning

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install nctl-scan
      uses: nirmata/action-install-nctl-scan@v0.0.6
      env:
        NIRMATA_TOKEN: ${{ env.NIRMATA_TOKEN }}
        NIRMATA_URL: ${{ env.NIRMATA_URL }}

    - name: Login to Nirmata
      run: |
        nctl login --url $NIRMATA_URL --userid $NIRMATA_USERID --token $NIRMATA_TOKEN
        echo "Successfully logged into Nirmata Control Hub"

    - name: Scan Repository with NCTL
      id: scan
      run: |
        echo "Starting repository security scan..."
        
        # Debug: Show current directory and repository structure
        echo "=== Debug Information ==="
        echo "Current working directory: $(pwd)"
        echo "Repository contents:"
        ls -la
        echo "Git repository info:"
        git remote -v
        echo "=== End Debug Information ==="
        
        # Debug: Show NCTL help and available commands
        echo "=== NCTL Help Information ==="
        nctl scan repository --help || echo "Failed to get help"
        echo "=== End NCTL Help ==="
        
        # Debug: Check available policy sets
        echo "=== Available Policy Sets ==="
        nctl get policy-sets || echo "Failed to get policy sets"
        echo "=== End Policy Sets ==="
        
        # Debug: Check environment variables (masked for security)
        echo "=== Environment Variables ==="
        echo "NIRMATA_URL: ${NIRMATA_URL:0:20}..."
        echo "NIRMATA_USERID: ${NIRMATA_USERID:0:10}..."
        echo "NIRMATA_TOKEN: ${NIRMATA_TOKEN:0:10}..."
        echo "=== End Environment Variables ==="
        
        # Verify NCTL authentication
        echo "=== Verifying NCTL Authentication ==="
        nctl info --token $NIRMATA_TOKEN --url $NIRMATA_URL || echo "Authentication failed"
        echo "=== End Authentication Check ==="
        
        # Check if login session is still valid
        echo "=== Checking Login Session ==="
        nctl info || echo "Login session check failed"
        echo "=== End Login Session Check ==="
        
        # Try scanning with global flags directly (bypassing login session)
        echo "=== Testing Scan with Global Flags ==="
        nctl scan repository --token $NIRMATA_TOKEN --url $NIRMATA_URL > global-scan.txt 2>&1
        GLOBAL_EXIT_CODE=$?
        echo "Global scan exit code: $GLOBAL_EXIT_CODE"
        if [ -f global-scan.txt ]; then
          echo "Global scan output:"
          cat global-scan.txt
        fi
        echo "=== End Global Scan Test ==="
        
        # Try with debug flag to get more information
        echo "=== Testing Scan with Debug Flag ==="
        nctl scan repository --debug --token $NIRMATA_TOKEN --url $NIRMATA_URL > debug-scan.txt 2>&1
        DEBUG_EXIT_CODE=$?
        echo "Debug scan exit code: $DEBUG_EXIT_CODE"
        if [ -f debug-scan.txt ]; then
          echo "Debug scan output:"
          cat debug-scan.txt
        fi
        echo "=== End Debug Scan Test ==="
        
        # Try scanning with explicit repository path
        echo "=== Testing Scan with Explicit Path ==="
        nctl scan repository . --token $NIRMATA_TOKEN --url $NIRMATA_URL > path-scan.txt 2>&1
        PATH_EXIT_CODE=$?
        echo "Path scan exit code: $PATH_EXIT_CODE"
        if [ -f path-scan.txt ]; then
          echo "Path scan output:"
          cat path-scan.txt
        fi
        echo "=== End Path Scan Test ==="
        
        # Test scan without policy sets first (using existing login session)
        echo "=== Testing Basic Scan ==="
        nctl scan repository > test-scan.txt 2>&1
        TEST_EXIT_CODE=$?
        echo "Test scan exit code: $TEST_EXIT_CODE"
        if [ -f test-scan.txt ]; then
          echo "Test scan output:"
          cat test-scan.txt
        fi
        echo "=== End Test Scan ==="
        
        # Try a very simple scan command
        echo "=== Testing Simple Scan ==="
        nctl scan repository --help > simple-scan.txt 2>&1
        echo "Simple scan help exit code: $?"
        echo "=== End Simple Scan Test ==="
        
        # Check if this is a git repository and has the right structure
        echo "=== Repository Structure Check ==="
        echo "Git status:"
        git status --porcelain || echo "Git status failed"
        echo "Git branch:"
        git branch || echo "Git branch failed"
        echo "Git log (last 3 commits):"
        git log --oneline -3 || echo "Git log failed"
        echo "=== End Repository Structure Check ==="
        
        # Check if there are any obvious issues with the repository
        echo "=== Repository Health Check ==="
        echo "Checking for common issues:"
        echo "1. Git repository integrity:"
        git fsck --no-dangling || echo "Git fsck failed"
        echo "2. Working directory status:"
        git diff --name-only || echo "No uncommitted changes"
        echo "3. Repository size:"
        du -sh . || echo "Size check failed"
        echo "=== End Repository Health Check ==="
        
        # Perform comprehensive repository scan with specific policy sets
        # Redirect output to file since --output-file is not supported
        echo "Running NCTL scan with policy sets..."
        nctl scan repository \
          --policy-sets pss-baseline,pss-restricted,rbac-best-practices,dockerfile-best-practices > scan-results.txt 2>&1
        
        # Check scan exit code
        SCAN_EXIT_CODE=$?
        if [ $SCAN_EXIT_CODE -eq 0 ]; then
          echo "Scan completed successfully"
          echo "::set-output name=scan_status::success"
        else
          echo "Scan completed with violations or errors"
          echo "::set-output name=scan_status::violations"
        fi
        
        # Parse scan results for summary
        if [ -f scan-results.txt ]; then
          echo "Scan output saved to scan-results.txt"
          
          # Try to extract violation count from the output
          VIOLATION_COUNT=$(grep -c "violation\|Violation\|VIOLATION" scan-results.txt 2>/dev/null || echo "0")
          POLICY_COUNT=$(grep -c "policy\|Policy\|POLICY" scan-results.txt 2>/dev/null || echo "0")
          
          echo "::set-output name=violation_count::$VIOLATION_COUNT"
          echo "::set-output name=policy_count::$POLICY_COUNT"
          
          echo "Scan Summary:"
          echo "- Policies evaluated: $POLICY_COUNT"
          echo "- Violations found: $VIOLATION_COUNT"
          
          # Display scan output for debugging
          echo "=== NCTL Scan Output ==="
          cat scan-results.txt
          echo "=== End Scan Output ==="
        else
          echo "No scan results file generated"
          echo "::set-output name=violation_count::0"
          echo "::set-output name=policy_count::0"
        fi

    - name: Generate Scan Report
      if: always()
      run: |
        echo "## 🔍 NCTL Security Scan Results" >> $GITHUB_STEP_SUMMARY
        
        if [ -f scan-results.txt ]; then
          # Try to extract violation count from the output
          VIOLATION_COUNT=$(grep -c "violation\|Violation\|VIOLATION" scan-results.txt 2>/dev/null || echo "0")
          POLICY_COUNT=$(grep -c "policy\|Policy\|POLICY" scan-results.txt 2>/dev/null || echo "0")
          
          echo "### 📊 Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Policies Evaluated:** $POLICY_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- **Violations Found:** $VIOLATION_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "$VIOLATION_COUNT" -gt 0 ]; then
            echo "### ⚠️ Violations Detected" >> $GITHUB_STEP_SUMMARY
            echo "Security violations were found during the scan. Please review and remediate these issues." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Extract violation details from text output
            echo "#### Violation Details:" >> $GITHUB_STEP_SUMMARY
            grep -i "violation\|error\|failed" scan-results.txt | head -10 >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "- Unable to parse violation details" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ No Violations Found" >> $GITHUB_STEP_SUMMARY
            echo "Great! No security violations were detected in this scan." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Show scan output summary
          echo "### 📋 Scan Output Summary" >> $GITHUB_STEP_SUMMARY
          echo "Full scan output has been saved and can be viewed in the workflow logs." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        else
          echo "### ❌ Scan Results Unavailable" >> $GITHUB_STEP_SUMMARY
          echo "Unable to generate scan report. Please check the workflow logs for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Provide NCH Integration Options
      if: always()
      run: |
        echo "### 🔗 Nirmata Control Hub Integration" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "To view detailed scan results and manage policy violations:" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Get repository URL for NCH integration
        REPO_URL="${{ github.server_url }}/${{ github.repository }}"
        NCH_REPO_URL="https://www.nirmata.io/webclient/#clusters/policyReport/repositoryDetails?repo=$REPO_URL&backurl=clustersPolicyReport"
        
        echo "#### 📋 View Policy Violation Reports" >> $GITHUB_STEP_SUMMARY
        echo "Click here to view detailed policy violation reports in Nirmata Control Hub:" >> $GITHUB_STEP_SUMMARY
        echo "[View in NCH]($NCH_REPO_URL)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "#### ⚡ Create Policy Exception" >> $GITHUB_STEP_SUMMARY
        echo "Need to create a policy exception? Use the same link above and navigate to the Policy Exceptions section:" >> $GITHUB_STEP_SUMMARY
        echo "[Create Exception in NCH]($NCH_REPO_URL)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "*Note: You must be logged into Nirmata Control Hub to access these features.*" >> $GITHUB_STEP_SUMMARY

    - name: Upload Scan Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nctl-scan-results
        path: |
          scan-results.txt
          .nctl/
        retention-days: 30

    - name: Comment on PR
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const { data: comments } = await github.rest.issues.listComments({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
          });
          
          // Check if we already commented
          const existingComment = comments.find(comment => 
            comment.user.type === 'Bot' && 
            comment.body.includes('NCTL Security Scan Results')
          );
          
          if (existingComment) {
            // Update existing comment
            await github.rest.issues.updateComment({
              comment_id: existingComment.id,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔍 NCTL Security Scan Results
              
              **Scan Status:** ${process.env.SCAN_STATUS || 'Unknown'}
              **Violations Found:** ${process.env.VIOLATION_COUNT || 'Unknown'}
              
              ### 📋 View Policy Violation Reports
              [View in Nirmata Control Hub](https://www.nirmata.io/webclient/#clusters/policyReport/repositoryDetails?repo=${context.payload.repository.html_url}&backurl=clustersPolicyReport)
              
              ### ⚡ Create Policy Exception
              [Create Exception in NCH](https://www.nirmata.io/webclient/#clusters/policyReport/repositoryDetails?repo=${context.payload.repository.html_url}&backurl=clustersPolicyReport)
              
              ---
              *This comment was automatically generated by the NCTL Security Scan workflow.*`
            });
          } else {
            // Create new comment
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔍 NCTL Security Scan Results
              
              **Scan Status:** ${process.env.SCAN_STATUS || 'Unknown'}
              **Violations Found:** ${process.env.VIOLATION_COUNT || 'Unknown'}
              
              ### 📋 View Policy Violation Reports
              [View in Nirmata Control Hub](https://www.nirmata.io/webclient/#clusters/policyReport/repositoryDetails?repo=${context.payload.repository.html_url}&backurl=clustersPolicyReport)
              
              ### ⚡ Create Policy Exception
              [Create Exception in NCH](https://www.nirmata.io/webclient/#clusters/policyReport/repositoryDetails?repo=${context.payload.repository.html_url}&backurl=clustersPolicyReport)
              
              ---
              *This comment was automatically generated by the NCTL Security Scan workflow.*`
            });
          }
      env:
        SCAN_STATUS: ${{ steps.scan.outputs.scan_status }}
        VIOLATION_COUNT: ${{ steps.scan.outputs.violation_count }}

    - name: Fail on Critical Violations
      if: steps.scan.outputs.scan_status == 'violations' && github.event_name == 'pull_request'
      run: |
        echo "❌ Security violations detected. Please review and fix these issues before merging."
        echo "You can view detailed reports in Nirmata Control Hub or create policy exceptions if needed."
        exit 1
